name: Neovim smoke tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]
    defaults:
      run:
        shell: bash

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git ripgrep unzip

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          package-manager-cache: false

      - name: Install Neovim and Tree-sitter CLI
        env:
          NEOVIM_CHANNEL: ${{ matrix.neovim }}
        run: |
          tools_dir="$RUNNER_TEMP/neovim-tools"
          mkdir -p "$tools_dir/bin"
          curl -fsSL --retry 3 -o "$tools_dir/neovim.tar.gz" \
            "https://github.com/neovim/neovim/releases/download/$NEOVIM_CHANNEL/nvim-linux-x86_64.tar.gz"
          tar -xzf "$tools_dir/neovim.tar.gz" -C "$tools_dir"
          curl -fsSL --retry 3 -o "$tools_dir/tree-sitter.zip" \
            https://github.com/tree-sitter/tree-sitter/releases/latest/download/tree-sitter-cli-linux-x64.zip
          unzip -q "$tools_dir/tree-sitter.zip" -d "$tools_dir/bin"
          chmod +x "$tools_dir/bin/tree-sitter"
          echo "$tools_dir/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "$tools_dir/bin" >> "$GITHUB_PATH"

      - name: Test a clean installation
        run: bash tests/smoke.sh
